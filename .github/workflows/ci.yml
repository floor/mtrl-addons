# Runs on every push and pull request. Without it a version tag publishes
# whatever is on that commit having run nothing: `prepublishOnly` builds, so a
# broken build fails the release, but the tests were never run in CI at all.
#
# The type check runs tsconfig.check.json, which covers src/ under strict mode.
# `bun run build` does not type check: bun's bundler strips types without
# reading them, so a type error reaches npm unless this step catches it.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run ts:check
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build
