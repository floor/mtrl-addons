# Check source compatibility and the package consumers will install.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Match the npm CLI used by trusted publishing in release.yml.
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Types
        run: bun run ts:check
      - name: Tests
        run: bun test
      - name: Build
        run: bun run build --production
      - name: Packed exports
        run: bun run check:package
